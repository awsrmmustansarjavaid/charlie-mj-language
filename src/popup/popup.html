<!doctype html>
<!-- Charlie MJ Language popup: quick launcher for the YouTube learning workspace. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charlie MJ Language</title><link rel="stylesheet" href="popup.css"></head><body>
  <header><div class="brand"><div class="logo">🌍</div><div><strong>Charlie MJ</strong><small>Language</small></div></div><button id="settings">⚙</button></header>
  <main>
    <section class="hero"><span>🎬 YouTube Learning</span><h1>Turn videos into lessons.</h1><p>Dual subtitles, vocabulary, transcript exports and focused learning in one workspace.</p></section>
    <div class="grid"><button id="learn">▶ Continue Learning</button><button id="focus">🎯 Focus Mode</button><button id="transcript">📜 Transcript</button><button id="watch">⏰ Watch Later</button><button id="library">📚 My Library</button></div>
    <section class="stats"><div><b id="words">0</b><span>Vocabulary</span></div><div><b id="bookmarks">0</b><span>Bookmarks</span></div><div><b id="videos">0</b><span>Watch Later</span></div></section>
    <p class="hint">Open a YouTube video to activate the Charlie MJ toolbar.</p>
  </main><script type="module" src="popup.js"></script>
</body></html>
