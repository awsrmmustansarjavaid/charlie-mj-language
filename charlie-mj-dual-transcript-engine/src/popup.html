<!doctype html>
<html><head><meta charset="utf-8"><title>Charlie MJ Dual Transcript</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>Charlie MJ Dual Transcript</h1>
    <label class="switchrow"><span>Enable dual transcript</span><input id="enabled" type="checkbox"></label>
    <label>Target language<select id="language">
      <option value="en">English</option><option value="ur">Urdu</option><option value="ar">Arabic</option><option value="zh-Hans">Chinese (Simplified)</option><option value="zh-Hant">Chinese (Traditional)</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ru">Russian</option><option value="hi">Hindi</option><option value="tr">Turkish</option></select></label>
    <label>Font scale<select id="scale"><option value="0.85">Small</option><option value="1">Medium</option><option value="1.15">Large</option><option value="1.3">Extra Large</option></select></label>
    <label>Background opacity<input id="opacity" type="range" min="0.2" max="1" step="0.05"></label>
    <div id="status">Open a YouTube video.</div>
    <div class="buttons"><button id="refresh">Fetch / refresh transcript</button><button id="openPanel">Open transcript panel</button></div>
    <p class="note">Native YouTube caption tracks are fetched locally. YouTube's own translated track is used when available.</p>
  </main>
  <script src="popup.js"></script>
</body></html>
